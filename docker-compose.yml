services:
  mysql:
    image: mysql:8.4
    container_name: halfstep-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: halfstep
      MYSQL_USER: halfstep
      MYSQL_PASSWORD: halfstep
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    container_name: halfstep-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: mysql+pymysql://halfstep:halfstep@mysql:3306/halfstep
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend/Dockerfile
    container_name: halfstep-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.example
    ports:
      - "8081:8081"
    depends_on:
      - backend

volumes:
  mysql_data:
